<h2>Enqueue 0.9.7</h2>
<ul>
  <li><b>플레이리스트 자기 정지 크래시 수정.</b> 플레이리스트 안에 그 플레이리스트 자신을 멈추는 정지 큐가 미리 대기(pre-wait) 0으로 들어 있으면, 그 큐가 도는 순간 앱이 꺼질 수 있던 것을 고쳤습니다.</li>
  <li><b>플러그인 꼬리 길이 갱신.</b> 리버브·딜레이의 길이(꼬리)를 늘리면, 큐가 그 꼬리를 끝까지 처리하지 않고 예전 길이에서 끊던 것을 고쳤습니다.</li>
  <li><b>장치·샘플레이트 변경 시 VST3 재준비.</b> ASIO 샘플레이트나 버퍼 크기를 바꾼 뒤에도 인서트 플러그인이 옛 설정으로 돌던 것을 고쳤습니다.</li>
</ul>
